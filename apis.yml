aid: quiq
name: Quiq
description: >-
  Quiq is an enterprise conversational AI and customer-experience platform for building, deploying,
  and governing agentic AI systems across digital and voice channels. Its products include AI Agents
  that resolve customer questions, AI Assistants that coach human agents in real time, Voice AI Agents,
  AI Workflows, AI Analysts, and a unified Digital Contact Center. Developers integrate through a REST
  API and webhooks for building native chat experiences, the AI Studio orchestration framework for
  serverless AI assistants, Quiq Bots for messaging automation, Rich Messaging for cross-platform
  message formatting, and Message-UI Extensions plus Salesforce and Oracle UI integrations. Quiq
  maintains SOC 2 Type II, HIPAA, GDPR, CCPA, and EU AI Act compliance with a 99.999% uptime SLA.
